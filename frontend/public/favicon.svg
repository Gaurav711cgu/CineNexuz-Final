<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#00E4FF" />
      <stop offset="45%" stopColor="#3B82F6" />
      <stop offset="100%" stopColor="#8B5CF6" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Orbit Ring -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="url(#brandGradient)" strokeWidth="3.5" strokeDasharray="6 3 15 3" />
  <circle cx="50" cy="50" r="38" fill="none" stroke="rgba(0,228,255,0.12)" strokeWidth="1.5" />

  <!-- Latitude/Grid -->
  <ellipse cx="50" cy="50" rx="38" ry="13" fill="none" stroke="rgba(0,228,255,0.2)" strokeWidth="1.2" transform="rotate(-25 50 50)" />
  <ellipse cx="50" cy="50" rx="13" ry="38" fill="none" stroke="rgba(0,228,255,0.2)" strokeWidth="1.2" transform="rotate(-25 50 50)" />

  <!-- Main C Shape Globe -->
  <path d="M 50 16 C 68.78 16, 84 31.22, 84 50 C 84 68.78, 68.78 84, 50 84 C 31.22 84, 16 68.78, 16 50 C 16 41.5, 19.1 33.7, 24.3 27.8 L 32.5 35 C 29.7 39, 28 44.3, 28 50 C 28 62.15, 37.85 72, 50 72 C 62.15 72, 72 62.15, 72 50 C 72 37.85, 62.15 28, 50 28 C 47 28, 44 28.6, 41.5 29.8 L 36.5 21.8 C 40.6 18.1, 45 16, 50 16 Z" fill="url(#brandGradient)" fillRule="evenodd" filter="url(#softGlow)" />

  <!-- Center Hub -->
  <circle cx="50" cy="50" r="14" fill="rgba(0,228,255,0.08)" stroke="url(#brandGradient)" strokeWidth="1.8" />
  <circle cx="50" cy="50" r="3.5" fill="#00E4FF" />
  <circle cx="72" cy="50" r="2.0" fill="#00E4FF" />
  <circle cx="28" cy="50" r="2.0" fill="#3B82F6" />
</svg>
