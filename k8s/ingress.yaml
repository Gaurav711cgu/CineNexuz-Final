apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cinenexus-ingress
  namespace: cinenexus
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  tls:
    - hosts:
        - api.cinenexus.ai
      secretName: cinenexus-tls-secret
  rules:
    - host: api.cinenexus.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cinenexus-backend-service
                port:
                  number: 80
